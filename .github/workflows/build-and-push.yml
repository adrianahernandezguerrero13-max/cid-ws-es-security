# ══════════════════════════════════════════════════════════════════════════════
# CI — Build de security-core (librería compartida)
# ══════════════════════════════════════════════════════════════════════════════
# security-core es una LIBRERÍA, no un servicio con imagen propia. Se distribuye
# dentro de la imagen base `cid-libs` (ver Dockerfile.libs y build-libs.yml en el
# gateway). Este workflow valida que la librería compile e instale en cada push.
#
# Cuando cambie esta librería, hay que regenerar cid-libs ejecutando el workflow
# "Build & Push cid-libs" (workflow_dispatch) en el repositorio cid-gateway.
# ══════════════════════════════════════════════════════════════════════════════

name: Build security-core

on:
  push:
    branches:
      - main
      - develop

env:
  ARTIFACT_NAME: security-core

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout de la librería
        uses: actions/checkout@v4

      - name: Extraer versión del pom.xml
        id: get_version
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "📦 Versión detectada: $VERSION"

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e instalar la librería
        run: mvn -B -DskipTests clean install

      - name: Resumen
        run: echo "✅ security-core ${{ env.VERSION }} compilada. Regenerar cid-libs para propagar el cambio a los microservicios."
